<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CAN Logger</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --fg:#1b1f24; --mute:#6b7280; --line:#e3e6ea;
          --ok:#16803c; --warn:#b45309; --bad:#b91c1c; --accent:#2563eb; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0f1216; --card:#171b21; --fg:#e6e8eb; --mute:#8b94a1; --line:#262c34;
            --ok:#4ade80; --warn:#fbbf24; --bad:#f87171; --accent:#60a5fa; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg);
         font:14px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
  main { max-width:1100px; margin:0 auto; padding:16px; }
  header { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:12px; }
  h1 { font-size:18px; margin:0; } h2 { font-size:13px; margin:0 0 8px; color:var(--mute);
       text-transform:uppercase; letter-spacing:.05em; font-weight:600; }
  .conn { font-size:12px; color:var(--mute); }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:12px; margin-bottom:16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:12px; }
  .card .t { display:flex; justify-content:space-between; font-weight:600; }
  .big { font-size:26px; font-weight:600; font-variant-numeric:tabular-nums; }
  .sub { color:var(--mute); font-size:12px; }
  .dot { display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:6px; background:var(--mute); }
  .ok .dot { background:var(--ok); } .warn .dot { background:var(--warn); } .bad .dot { background:var(--bad); }
  button { background:var(--accent); color:#fff; border:0; border-radius:6px; padding:5px 12px; font:inherit; cursor:pointer; }
  button:disabled { opacity:.5; cursor:default; }
  input[type=text] { background:var(--card); color:var(--fg); border:1px solid var(--line); border-radius:6px; padding:4px 8px; font:inherit; width:100%; }
  .vin { font-family:ui-monospace,Menlo,monospace; font-size:18px; font-weight:600; letter-spacing:.04em; }
  .badge { font-size:11px; border:1px solid var(--line); border-radius:99px; padding:0 7px; color:var(--mute); }
  section { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:12px; margin-bottom:16px; }
  .scroll { overflow:auto; max-height:360px; }
  table { border-collapse:collapse; width:100%; font-variant-numeric:tabular-nums; }
  th,td { text-align:left; padding:4px 10px 4px 0; border-bottom:1px solid var(--line); white-space:nowrap; }
  th { color:var(--mute); font-weight:600; font-size:12px; position:sticky; top:0; background:var(--card); }
  td.m { font-family:ui-monospace,Menlo,monospace; }
  .empty { color:var(--mute); padding:8px 0; }
  select { background:var(--card); color:var(--fg); border:1px solid var(--line); border-radius:6px; padding:3px 6px; }
</style>
</head>
<body>
<main>
  <header><h1>CAN Logger</h1><span class="conn" id="conn">connecting…</span></header>

  <div id="none" class="card" style="display:none;text-align:center;padding:40px 12px">
    <div class="big" style="font-weight:500">No car connected</div>
  </div>

  <div id="live" style="display:none">
  <h2>VIN</h2>
  <div class="grid" id="car"></div>

  <h2>Boards</h2>
  <div id="boards"></div>

  <div id="valbox" style="display:none">
    <div id="vals"></div>
    <div id="cellbox" style="display:none">
      <h2>Battery cell voltages <button id="fastbtn" onclick="toggleFast()" style="margin-left:8px"></button></h2>
      <div id="cells"></div>
    </div>
  </div>

  <section>
    <details id="sigbox">
      <summary><b>Decoded signals</b> <span class="sub" id="sigsum"></span></summary>
      <div style="margin:8px 0"><input type="text" id="sigflt" placeholder="filter by message or signal name"></div>
      <div class="scroll"><table><thead><tr><th>Channel</th><th>ID</th><th>Signal</th><th>Value</th><th>Unit</th></tr></thead>
      <tbody id="sigs"></tbody></table></div>
    </details>
  </section>

  <section>
    <h2>Live IDs, last <span id="win">10</span> s &nbsp;
      <select id="flt"><option value="">all channels</option></select></h2>
    <div class="scroll"><table><thead><tr><th>Board</th><th>Ch</th><th>ID</th><th>Rate (Hz)</th><th>DLC</th><th>Last data</th></tr></thead>
    <tbody id="ids"></tbody></table></div>
  </section>

  <section>
    <h2>Newest frames</h2>
    <div class="scroll"><table><thead><tr><th>Age</th><th>Board</th><th>Ch</th><th>ID</th><th>DLC</th><th>Data</th></tr></thead>
    <tbody id="recent"></tbody></table></div>
  </section>
  </div>
</main>
<script>
const $ = id => document.getElementById(id);
const cellbox = $("cellbox");
const fmtAge = a => a == null ? "never" : a < 1 ? "<1 s ago" : a < 90 ? Math.round(a) + " s ago" : Math.round(a/60) + " min ago";
const esc = s => String(s ?? "").replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
let sel = "";
$("flt").onchange = e => { sel = e.target.value; };

// 5-segment signal icon: bars light up at -85, -75, -67, -60, -50 dBm.
function rssiBars(r) {
  const on = (r == null || r === 0) ? 0 : [-85, -75, -67, -60, -50].filter(t => r >= t).length;
  const bars = [0, 1, 2, 3, 4].map(i => {
    const h = 5 + i * 3;
    return `<rect x="${i * 5}" y="${17 - h}" width="3.5" height="${h}" rx="0.8" fill="${i < on ? "var(--fg)" : "var(--line)"}"/>`;
  }).join("");
  return `<svg width="24" height="17" viewBox="0 0 24 17" role="img" aria-label="WiFi signal ${on} of 5" style="vertical-align:-3px">${bars}</svg>`;
}
const rssiText = r => r == null ? "n/a" : r === 0 ? "offline" :
  `${r} dBm (${r >= -60 ? "excellent" : r >= -70 ? "good" : r >= -80 ? "fair" : "weak"})`;

function renderCar(c) {
  const vin = c.state === "identified" ? esc(c.vin) :
    c.state === "identifying" ? "Reading VIN…" : "VIN unavailable";
  $("car").innerHTML = `<div class="card"><div class="t"><span>Vehicle</span>
    <span class="badge">connected ${fmtAge(c.connected_age).replace(" ago", "")}</span></div>
    <div class="vin" style="${c.state === "identified" ? "" : "color:var(--mute)"}">${vin}</div>
    ${c.state === "failed" ? `<div class="sub">${esc(c.note || "no reply from the car")}</div>` : ""}</div>`;
}

function render(d) {
  $("win").textContent = d.window;
  renderCar(d.car);
  const dotCls = age => age == null ? "" : age < 5 ? "ok" : age < 30 ? "warn" : "bad";
  $("boards").innerHTML = d.boards.length ? d.boards.map(b => {
    const idle = b.last_rx_age == null;
    const cls = idle ? "warn" : dotCls(b.last_rx_age);
    const rows = d.channels.filter(c => c.board === b.board).map(c => `<tr class="${dotCls(c.last_age)}">
      <td><span class="dot"></span>${esc(c.name || "?")}</td><td>${c.ch}</td><td>${c.fd ? "CAN FD capable" : "classic CAN"}</td>
      <td style="text-align:right">${c.rate.toFixed(1)} fps</td><td style="text-align:right">${c.total.toLocaleString()}</td>
      <td>${fmtAge(c.last_age)}</td></tr>`).join("");
    return `<section style="margin-bottom:12px"><div class="t ${cls}" style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px">
        <b><span class="dot"></span>Board ${b.board}</b>
        <span class="sub">${b.ssid ? esc(b.ssid) : "network unknown"} &nbsp;${rssiBars(b.rssi)}</span>
        <span class="sub">${idle ? "online, no CAN traffic" : "last upload " + fmtAge(b.last_rx_age)}</span>
        ${b.boot_id == null ? "" : `<span class="badge">boot ${b.boot_id.toString(16)}</span>`}
        ${b.dropped > 0 ? `<span class="sub" style="color:var(--bad)">dropped ${b.dropped.toLocaleString()} frames</span>` : ""}</div>
      <div class="scroll" style="max-height:none;margin-top:6px"><table><thead><tr><th>Channel</th><th>Port</th><th>Type</th>
        <th style="text-align:right">Rate</th><th style="text-align:right">Frames</th><th>Last frame</th></tr></thead>
        <tbody>${rows}</tbody></table></div></section>`;
  }).join("") : `<div class="empty">No board has uploaded yet.</div>`;

  const opts = d.channels.map(c => `${c.board}${c.ch}`);
  const f = $("flt");
  if (f.options.length - 1 !== opts.length) {
    f.innerHTML = `<option value="">all channels</option>` +
      d.channels.map(c => `<option value="${c.board}${c.ch}">B${c.board} ${c.ch} ${esc(c.name || "")}</option>`).join("");
    f.value = sel;
  }
  const ids = d.ids.filter(i => !sel || `${i.board}${i.ch}` === sel);
  $("ids").innerHTML = ids.length ? ids.map(i => `<tr><td>${i.board}</td><td>${i.ch}</td>
    <td class="m">${i.id}</td><td>${i.rate.toFixed(1)}</td><td>${i.dlc}</td><td class="m">${i.data}</td></tr>`).join("")
    : `<tr><td colspan="6" class="empty">No frames in the last ${d.window} s.</td></tr>`;
  $("recent").innerHTML = d.recent.length ? d.recent.map(r => `<tr><td>${r.age.toFixed(2)} s</td><td>${r.board}</td>
    <td>${r.ch}</td><td class="m">${r.id}</td><td>${r.dlc}</td><td class="m">${r.data}</td></tr>`).join("")
    : `<tr><td colspan="6" class="empty">No frames yet.</td></tr>`;
}

function renderDecoded(d) {
  const pol = d.polled || [];
  $("valbox").style.display = pol.length ? "" : "none";
  const order = ["Vehicle", "Battery", "Charging", "Drive", "Climate", "Chassis", "Body"];
  const groups = {};
  // the cell and module voltage summaries are shown in the cell table below, not as cards
  // also dropped as duplicates: the VIN (in the Car card) and the health block's second capacity and raw SOH
  const inTable = v => /^(Cell|Module) voltage (min|max|average|spread)$/.test(v.name)
    || ["VIN", "Pack capacity (health block)", "State of health (raw)"].includes(v.name);
  pol.filter(v => !inTable(v)).forEach(v => (groups[v.group] = groups[v.group] || []).push(v));
  // first in the Battery group: state of health, state of charge, Hx
  const top = ["State of health", "State of charge", "Hx"];
  (groups.Battery || []).sort((a, b) => (top.indexOf(a.name) + 1 || 99) - (top.indexOf(b.name) + 1 || 99));
  const fmt = v => typeof v === "number" ? v.toLocaleString(undefined, {maximumFractionDigits: 2}) : v;
  $("vals").innerHTML = Object.keys(groups).sort((a, b) => order.indexOf(a) - order.indexOf(b)).map(g =>
    `<h2>${esc(g === "Battery" ? "HV Battery" : g)}</h2><div class="grid" style="margin-bottom:16px">` +
    groups[g].map(v => `<div class="card" title="updated ${v.age} s ago"><div class="sub">${esc(v.name)}</div>
      <div class="big" style="font-size:20px">${esc(fmt(v.value))} <span class="sub">${esc(v.unit)}</span></div></div>`).join("") +
    `</div>` + (g === "Battery" ? `<div id="cellslot"></div>` : "")).join("");
  // the cell voltage table goes right under the Battery cards
  ($("cellslot") || $("valbox")).appendChild(cellbox);
  const cv = (d.cells || []).filter(c => c > 0 && c < 6000);
  cellbox.style.display = cv.length ? "" : "none";
  if (cv.length) {
    const avg = cv.reduce((a, b) => a + b, 0) / cv.length;
    const spread = Math.max(...cv) - Math.min(...cv);
    const range = `${Math.min(...cv)}–${Math.max(...cv)} mV, average ${Math.round(avg)} mV`;
    // Limits: spread up to 30 mV is good (the Autel report's voltage delta threshold), over 100 mV is
    // bad (forum rule of thumb), in between is a warning. A single cell is judged against the average:
    // within 15 mV good, up to 50 mV warning, beyond that bad (these two are our own numbers).
    // Only judged while the pack current is small: a healthy pack shows up to ~50 mV under heavy load.
    const cur = (pol.find(v => v.name === "Pack current (1)") || {}).value;
    const judged = typeof cur === "number" && Math.abs(cur) <= 5;
    const lvl = (v, good, bad) => v <= good ? "ok" : v <= bad ? "warn" : "bad";
    const tint = k => `color-mix(in srgb, var(--${k}) 35%, transparent)`;
    const verdict = judged
      ? {ok: "Good", warn: "Warning", bad: "Bad"}[lvl(spread, 30, 100)] : "Not judged";
    const vk = judged ? lvl(spread, 30, 100) : "";
    const note = judged ? "limits: good up to 30 mV, warning up to 100 mV, bad above"
      : `pack current ${cur == null ? "unknown" : cur + " A"}; judged only within ±5 A`;
    // 24 modules of 4 consecutive cells, as in the Autel battery report of this car.
    const rows = [];
    for (let m = 0; m < 24 && m * 4 < d.cells.length; m++) {
      const cells = d.cells.slice(m * 4, m * 4 + 4);
      const sum = cells.reduce((a, b) => a + b, 0) / 1000;
      const tiles = cells.map((c, i) => {
        // within 10 mV of the average green, further below blue, further above red
        const dv = c - Math.round(avg);
        const bg = Math.abs(dv) <= 10 ? "hsl(140 45% 28%)" : dv < 0 ? "hsl(215 60% 38%)" : "hsl(0 60% 38%)";
        return `<td class="m" style="padding:3px 6px"><div title="cell ${m * 4 + i + 1}: ${dv >= 0 ? "+" : ""}${dv} mV from average"
          style="background:${bg};color:#fff;border-radius:5px;padding:4px 0;text-align:center">${(c / 1000).toFixed(3)} V</div></td>`;
      }).join("");
      // a module with any cell more than 10 mV from the average is out of balance: orange text
      const off = cells.some(c => Math.abs(c - Math.round(avg)) > 10);
      rows.push(`<tr><td${off ? ' style="color:hsl(30 90% 55%);font-weight:600"' : ""}>M${m + 1} <span class="sub">(#${m * 4 + 1}–#${m * 4 + cells.length})</span></td>
        <td class="m"><b>${sum.toFixed(2)} V</b></td>${tiles}</tr>`);
    }
    $("cells").innerHTML = `<div class="card ${vk}" style="margin-bottom:8px"><span class="dot"></span><b>Cell spread ${spread} mV: ${verdict}</b>
      <div class="sub">${range}</div><div class="sub">* ${note}</div></div>
      <div class="card"><div class="scroll" style="max-height:none"><table><thead><tr>
      <th>Module</th><th>Voltage</th><th>Cell 1</th><th>Cell 2</th><th>Cell 3</th><th>Cell 4</th></tr></thead>
      <tbody>${rows.join("")}</tbody></table></div></div>`;
    const tm = t => new Date(t * 1000).toLocaleTimeString(), sg = v => (v > 0 ? "+" : "") + v + " mV";
    const hist = (d.history || []).map(e => `<tr><td>M${e.module}</td>
      <td class="m"><b>${sg(e.peak)}</b> <span class="sub">cell ${e.cell} at ${tm(e.t)}</span></td>
      <td class="m">${sg(e.min)}</td><td class="m">${sg(e.max)}</td><td class="m">${tm(e.first)}</td></tr>`).join("");
    $("cells").innerHTML += `<div class="card" style="margin-top:8px"><div class="scroll" style="max-height:none"><table><thead><tr>
      <th>Out of balance</th><th>Peak from average</th><th>Lowest</th><th>Highest</th><th>First out</th></tr></thead>
      <tbody>${hist || `<tr><td colspan="5" class="empty">No module out of balance in this session.</td></tr>`}</tbody></table></div></div>`;
  }
  const sg = d.signals || [];
  $("sigsum").textContent = !d.have_dbc ? "(signal files missing: run server/fetch_dbc.sh)"
    : `${sg.length} signals · set ${d.dbc}`;
  if (!$("sigbox").open) return;
  const f = $("sigflt").value.trim().toLowerCase();
  const rows = sg.filter(x => !f || (x.msg + " " + x.sig + " " + x.ch).toLowerCase().includes(f)).slice(0, 600);
  $("sigs").innerHTML = rows.length ? rows.map(x => `<tr><td>${esc(x.ch)}</td><td class="m">${esc(x.id)}</td>
    <td>${esc(x.sig)}</td><td class="m">${esc(x.text ?? x.value)}${x.text != null ? ` <span class="sub">(${esc(x.value)})</span>` : ""}</td>
    <td>${esc(x.unit)}</td></tr>`).join("") : `<tr><td colspan="5" class="empty">No decoded signals.</td></tr>`;
}
let fastOn = false;
async function toggleFast() {
  try { fastOn = (await (await fetch("/api/fast?on=" + (fastOn ? 0 : 1), {method: "POST"})).json()).on; } catch (e) {}
  showFast();
}
function showFast() { $("fastbtn").textContent = fastOn ? "Fast polling ON (~5 s): switch off" : "Fast polling (~5 s)"; }
async function tickDecoded() {
  try {
    const d = await (await fetch("/api/decoded", {cache: "no-store"})).json();
    if (d.active) { fastOn = !!d.fast; showFast(); renderDecoded(d); }
  } catch (e) {}
}

let pageVersion = null;
async function tick() {
  try {
    const r = await fetch("/api/status", {cache: "no-store"});
    const d = await r.json();
    if (pageVersion === null) pageVersion = d.page;
    else if (d.page !== pageVersion) { location.reload(); return; }   // dashboard was updated
    $("live").style.display = d.active ? "" : "none";
    $("none").style.display = d.active ? "none" : "";
    if (d.active) render(d);
    $("conn").textContent = d.active ? "live · " + new Date().toLocaleTimeString() : "";
  } catch (e) {
    $("conn").textContent = "server unreachable";
  }
}
tick(); setInterval(tick, 1000);
tickDecoded(); setInterval(tickDecoded, 3000);
$("sigflt").oninput = tickDecoded;
$("sigbox").ontoggle = tickDecoded;
</script>
</body>
</html>
