; Nissan LEAF / e-NV200 CAN logger — passive listen-only tap
; Target board: LilyGo T-2CANFD (ESP32-S3, 16 MB flash / 8 MB OPI PSRAM)
; Two boards, each logging two channels, uploading to a server over WiFi.
;
; CAN-B = native ESP32-S3 TWAI (classic CAN only)
; CAN-A = MCP2518FD via ACAN2517FD (CAN-FD capable; run as classic 2.0B here)

[env]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

board_build.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
board_build.partitions = default_16MB.csv

; Both overrides are required, or the 16 MB partition table is rejected by the
; bootloader and the board boot-loops silently (hardware-verified in CANBRIDGE).
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216

; T-2CANFD has no USB-UART bridge: Serial is the S3's native USB-Serial-JTAG.
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

lib_deps =
    pierremolinaro/ACAN2517FD

[env:board1]
build_flags = ${env.build_flags} -DLOGGER_BOARD_ID=1

[env:board2]
build_flags = ${env.build_flags} -DLOGGER_BOARD_ID=2
